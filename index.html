<style>
:root{
--bg:#f7f4ee;--surface:#fff;--ink:#2b2823;--muted:#6e6a62;--line:#e4dfd4;--accent:#0f6b52;--accent-soft:#e3f0ea;
--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;--s12:96px;
--r:16px;--r-pill:999px;--shadow:0 1px 2px rgba(43,40,35,.04),0 8px 24px rgba(43,40,35,.06);
--display:'Fraunces',Georgia,'Times New Roman',serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--ease:200ms ease-out
}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--s3)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;color:var(--ink)}
h1{font-size:clamp(2.5rem,6vw,4rem);letter-spacing:-.02em}
h2{font-size:clamp(1.75rem,3.5vw,2.25rem);letter-spacing:-.01em;margin-bottom:var(--s4)}
h3{font-size:1.25rem}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:rgba(15,107,82,.18);color:var(--ink)}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.eyebrow{display:block;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--s1)}
section{padding:var(--s12) 0;border-top:1px solid var(--line);scroll-margin-top:72px}
section.hero{border-top:0;padding:var(--s8) 0 var(--s12)}
.muted{color:var(--muted)}

nav{position:sticky;top:0;z-index:50;background:rgba(247,244,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:var(--s2)}
.brand{font-family:var(--display);font-weight:600;font-size:1.125rem;color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:var(--s1);list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
nav ul::-webkit-scrollbar{display:none}
nav li a{display:block;padding:8px 12px;border-radius:var(--r-pill);font-size:.875rem;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color var(--ease),background var(--ease)}
nav li a:hover{color:var(--ink)}
nav li a.active{color:var(--accent);background:var(--accent-soft)}

.hero-grid{display:grid;grid-template-columns:1fr 280px;gap:var(--s8);align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-size:.875rem;font-weight:600;margin-bottom:var(--s3)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.role{font-size:1.125rem;color:var(--muted);margin-top:var(--s2);font-weight:500}
.value{margin-top:var(--s3);font-size:1.125rem;max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.btn{display:inline-block;padding:14px 28px;border-radius:var(--r-pill);font-weight:600;font-size:.9375rem;text-decoration:none;transition:background var(--ease),transform var(--ease),border-color var(--ease)}
.btn-primary
